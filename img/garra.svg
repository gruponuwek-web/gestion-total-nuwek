<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Gestión Nuwek · garra de jaguar</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c4d45"/>
      <stop offset="1" stop-color="#17291f"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE68A"/>
      <stop offset="1" stop-color="#E9C53A"/>
    </linearGradient>
    <linearGradient id="una" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dccf"/>
    </linearGradient>
    <!-- uña curva y afilada (apunta hacia arriba) -->
    <path id="u" d="M-6.5 6 C-7 -5 -3 -15 6 -22 C2.5 -13 3 -4 6.5 6 Q0 9 -6.5 6 Z"/>
    <g id="r"><path d="M-7 -2 a7 7 0 0 1 5 -5.5"/><path d="M3 -6.5 a7 7 0 0 1 4 6"/><path d="M5.5 4 a7 7 0 0 1 -7 3.5"/><path d="M-5 5 a7 7 0 0 1 -2.4 -4"/></g>
    <!-- dedo -->
    <ellipse id="d" cx="0" cy="0" rx="10.5" ry="13"/>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#fondo)"/>
  <!-- rosetas de jaguar, sutiles, de fondo -->
  <g fill="none" stroke="#F3DA5D" stroke-opacity=".13" stroke-width="3.2" stroke-linecap="round">
    <use href="#r" transform="translate(18 20)"/><use href="#r" transform="translate(110 18) rotate(40) scale(.85)"/>
    <use href="#r" transform="translate(16 108) rotate(-30) scale(.9)"/><use href="#r" transform="translate(112 110) rotate(80)"/>
  </g>
  <g fill="#F3DA5D" fill-opacity=".13"><circle cx="18" cy="20" r="2"/><circle cx="110" cy="18" r="1.7"/><circle cx="16" cy="108" r="1.8"/><circle cx="112" cy="110" r="2"/></g>
  <!-- uñas -->
  <g fill="url(#una)" stroke="#17291f" stroke-width="1.2" stroke-linejoin="round">
    <use href="#u" transform="translate(30 44) rotate(-28) scale(-1 1)"/>
    <use href="#u" transform="translate(51 30) rotate(-8) scale(-1 1)"/>
    <use href="#u" transform="translate(77 30) rotate(10)"/>
    <use href="#u" transform="translate(98 44) rotate(30)"/>
  </g>
  <!-- dedos -->
  <g fill="url(#oro)">
    <use href="#d" transform="translate(32 56) rotate(-25)"/>
    <use href="#d" transform="translate(52 42) rotate(-8) scale(1.05)"/>
    <use href="#d" transform="translate(76 42) rotate(8) scale(1.05)"/>
    <use href="#d" transform="translate(96 56) rotate(25)"/>
    <!-- almohadilla principal (tres lóbulos abajo, como la huella real del jaguar) -->
    <path d="M64 62
             C80 62 94 74 96 88
             C98 98 92 104 85 103
             C81 103 79 108 74 110
             C69 112 66 109 64 107
             C62 109 59 112 54 110
             C49 108 47 103 43 103
             C36 104 30 98 32 88
             C34 74 48 62 64 62 Z"/>
  </g>
  <!-- brillo suave -->
  <path d="M48 72 C54 66 62 65 68 66" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
